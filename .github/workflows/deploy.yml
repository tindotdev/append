name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: ["main"]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Validate that CI passed before deploying
  check-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check CI status
        if: github.event.workflow_run.conclusion != 'success'
        run: |
          echo "CI workflow failed or was cancelled"
          exit 1

  deploy-api:
    runs-on: ubuntu-latest
    # Run only if CI check passed
    needs: [check-ci]
    if: needs.check-ci.result == 'success'
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"

      - uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Sync secrets from Doppler to Cloudflare
        working-directory: packages/api
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PROD_APPEND }}
        run: |
          # Sync all secrets from Doppler to Cloudflare Worker (production)
          # This makes Doppler the canonical source of truth for secrets
          doppler secrets download --no-file --format json | \
            pnpm exec wrangler secret bulk --config wrangler.jsonc

      - name: Apply D1 migrations
        working-directory: packages/api
        run: pnpm exec wrangler d1 migrations apply append-db --remote --config wrangler.jsonc

      - name: Deploy Worker API
        working-directory: packages/api
        run: pnpm run deploy -- --config wrangler.jsonc

  deploy-web:
    runs-on: ubuntu-latest
    # Run only if CI check passed
    needs: [check-ci]
    if: needs.check-ci.result == 'success'
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"

      - uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        working-directory: packages/web
        env:
          VITE_API_URL: https://api.append.tindev.dev
        run: pnpm run build

      - name: Deploy web to Pages
        working-directory: packages/web
        # Omit --branch to deploy to Production (custom domains require Production deployment)
        run: pnpm exec wrangler pages deploy dist --project-name "append-web"
